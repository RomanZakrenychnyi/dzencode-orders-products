name: dzencode-orders-products

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: orders_products
      DB_USER: orders_app
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders_products
      MYSQL_USER: orders_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM product_prices LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
